# Ad contacts — a manual fill of `hub_ad_contacts` (ELI-22).
#
# The weekly ingest already runs the pass (`hub_daily.py --ad-contacts`,
# 200k ads a week, after the ad-text jobs). This workflow
# is for the FIRST fill of the ~635k open ads, or a re-read after a parser
# rules bump, without re-running the whole ingest.
#
# Machine-triggered only (ARCHITECTURE.md RULE 1): it calls the deployed API
# with the scoped ingest token; no user and no UI can start the pass. It reads
# ad texts already in the corpus — no outbound fetch of a public source.
name: Hub · ad contacts (manual fill)

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Open ads to read this run (batches of 5,000)"
        required: false
        default: "700000"
      model_budget:
        description: "Ads the rules named nobody in to ask the model about (ELI-25; 0 = off)"
        required: false
        default: "100000"

concurrency:
  # Same group as the weekly ingest: one writer on the corpus at a time.
  group: hub-ingest
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Read contact persons from open ads
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          BUDGET: ${{ github.event.inputs.budget }}
          MODEL_BUDGET: ${{ github.event.inputs.model_budget }}
        run: >-
          python -m scripts.hub_daily --ad-contacts-only --ad-contacts "${BUDGET:-700000}"
          --ad-contacts-model "${MODEL_BUDGET:-100000}"
