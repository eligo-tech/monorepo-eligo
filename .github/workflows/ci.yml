name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Both, because the matrix installs from the lock on 3.12 and from
          # pyproject on 3.11 — keying on one would leave the other's cache
          # unaffected by a change to its own input.
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock

      - name: Install dependencies (locked — 3.12 mirrors production)
        if: matrix.python-version == '3.12'
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Install dependencies (free resolution — 3.11 is the canary)
        # Deliberately NOT locked. A lock on every job would hide the day a
        # floor in pyproject stops being satisfiable, which is the thing a
        # lock makes easy to ignore. This job is allowed to break first.
        if: matrix.python-version != '3.12'
        # `monitoring` too: the crash-reporting tests import sentry_sdk at
        # module scope, so without it this job fails at COLLECTION and the
        # matrix cancels its sibling — one missing extra, two red jobs.
        run: pip install -e ".[dev,monitoring]"

      - name: Lint
        # Catches undefined names and unused imports — the class of bug tests
        # miss when the code path is only reached in production.
        run: ruff check app scripts tests

      - name: Run tests
        # Runs on the SQLite fallback — no external services or secrets needed.
        env:
          ELIGO_DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
        run: pytest -q

  locks:
    # The dependency locks are what makes a deploy reproducible, so whether
    # they are current is its own question — not a side effect of the Postgres
    # job, where it previously lived and had nothing to do with RLS.
    name: Dependency locks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv (PINNED — see below)
        # Pinned for the same reason everything else here is. `pipx run uv`
        # fetches the newest uv on every run, and a resolver or output change
        # would fail the comparison below with nothing actually wrong. The
        # locks in the repository were produced by this exact version.
        run: pip install uv==0.10.7

      - name: Recompile both locks and compare
        # `--no-header` matters: uv stamps the --output-file path into the
        # header it writes, so comparing a lock compiled to /tmp against one
        # committed as requirements.lock differed on line 2 every single time
        # and the check could never pass.
        #
        # SEEDING the output file matters just as much, and for the opposite
        # reason. `uv pip compile` reads an existing output file and treats
        # its pins as preferences; compiling to an EMPTY /tmp path instead
        # resolves everything fresh, to whatever is newest on PyPI right now.
        # That made this job fail on unrelated PRs the moment any transitive
        # dependency published — openai 3.39.0 -> 3.40.0 and pypdf 6.21.2 ->
        # 6.21.3, roughly 20 hours after the locks were committed, turned a
        # docs-only PR red. A check that goes red for reasons the author
        # cannot act on is a check people learn to override.
        #
        # Copying the committed lock in first asks the question we actually
        # mean: "does this lock still satisfy pyproject.toml?" — not "is this
        # lock what a fresh resolution would produce today?". Verified to
        # still catch a real stale lock: adding a dependency and raising a
        # version floor both fail it.
        run: |
          cp requirements.lock /tmp/prod.lock
          cp requirements-dev.lock /tmp/dev.lock
          uv pip compile pyproject.toml --extra postgres --extra llm --extra monitoring \
            --python-version 3.12 --no-header --quiet -o /tmp/prod.lock
          uv pip compile pyproject.toml --extra postgres --extra llm --extra monitoring \
            --extra dev --python-version 3.12 --no-header --quiet -o /tmp/dev.lock
          stale=0
          # Both are compared before failing: short-circuiting reports one
          # stale lock, you fix it, push, and discover the other.
          diff -u requirements.lock /tmp/prod.lock || stale=1
          diff -u requirements-dev.lock /tmp/dev.lock || stale=1
          if [ "$stale" != 0 ]; then
            echo "::error::a lock is stale — recompile both (command in backend/Dockerfile)"
            exit 1
          fi

      - name: The lock that ships must agree with the lock that is tested
        # CI installs requirements-dev.lock; the image installs
        # requirements.lock. Nothing else makes those two agree, so a runtime
        # pin could drift between what is tested and what deploys — which is
        # the failure this whole change exists to prevent.
        run: |
          strip() { grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$1" | sed 's/[[:space:]]*$//' | sort -u; }
          missing=$(comm -23 <(strip requirements.lock) <(strip requirements-dev.lock))
          if [ -n "$missing" ]; then
            echo "::error::these shipped pins are absent from the tested lock:"
            echo "$missing"
            exit 1
          fi
          echo "every shipped pin appears identically in the tested lock"

  rls:
    name: Backend · RLS on Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The rest of the suite runs on SQLite, which has no Row-Level Security.
    # It proves the query layer filters by tenant_id; it cannot prove the
    # DATABASE refuses when the application forgets. ADR 0002 §6 records this
    # as owed.
    #
    # It stopped being theoretical on 2026-10-25, when `activity_targets`
    # reached the production database through `create_all` — which makes
    # tables but not policies — and sat there as the only tenant table with
    # FORCE off. The suite was green. A human found it by reading
    # `apply_rls --status` output. This job is that reading, automated.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eligo_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eligo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eligo_owner -d eligo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The OWNER connection: DDL, migrations, and the RLS setup.
      ELIGO_ADMIN_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
      ELIGO_DB_APP_ROLE: eligo_app
      # Throwaway, for a container that lives about ninety seconds. The point
      # of a password here is that it puts the app role in LOGIN mode, which
      # is how production connects — as a role that is NOT the table owner.
      ELIGO_DB_APP_ROLE_PASSWORD: ci_app_pw
      ELIGO_DB_SSL: 'false'
      ELIGO_AUTH_ENABLED: 'false'
      ELIGO_LLM_PROVIDER: heuristic

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install the locked dependencies
        # The versions the production image ships, so this job tests what
        # actually deploys rather than whatever resolves today.
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Create the schema
        # `create_all`, not `alembic upgrade head`: the migrations are written
        # against a baseline this creates, so 0003 fails on an empty database.
        # This is also the documented bootstrap for a customer bringing their
        # own database — and the path that was broken until today, because
        # the receipts append-only trigger was sent to asyncpg as five
        # statements in one prepared statement.
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
        run: python -c "import asyncio; from app.core.database import create_all; asyncio.run(create_all())"

      - name: Mark migrations as applied
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
        run: alembic stamp head

      - name: Provision the app role and apply RLS
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
        run: python -m scripts.apply_rls

      - name: Prove the isolation
        # Connects as eligo_app — the non-owner role production uses. Running
        # these as the owner would prove nothing: the owner is exactly who
        # FORCE exists to constrain.
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_app:ci_app_pw@localhost:5432/eligo
        # The MCP path too: two workspaces through /mcp, as the runtime role.
        run: pytest tests/test_rls_postgres.py tests/test_mcp_isolation_postgres.py tests/test_receipt_blackout_postgres.py tests/test_erasure_postgres.py -q

      - name: Prove every tenant table is actually policed
        # The startup guard, run as a CI gate. `apply_rls` derives its table
        # list from the MODELS; this check derives it from the DATABASE, and
        # the gap between those two is the failure it exists to catch — a
        # table that `create_all` put there and no policy ever covered.
        # Add a tenant-scoped table without a policy and this step fails,
        # instead of the deploy coming up fail-open.
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_app:ci_app_pw@localhost:5432/eligo
          ELIGO_AUTH_ENABLED: 'true'
        # The strict check, not the startup guard: the guard treats "could
        # not connect" as a warning, so this step used to pass when the app
        # role could not even log in.
        run: python -m scripts.check_rls_enforced

      - name: Report the final state
        if: always()
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
        run: python -m scripts.apply_rls --status

  upgrade:
    name: Backend · upgrade from main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Every other job builds a FRESH schema (`create_all` + `stamp head`).
    # Production is never fresh: the Dockerfile runs `alembic upgrade head`
    # against the schema the previous deploy left. Until this job, the first
    # time a migration met that schema was the Railway deploy (review
    # 2026-10-31, #3).
    #
    # So: build the schema as the TARGET (main, i.e. production) has it, put
    # rows in it, then upgrade it with this PR's code. Each failure below was
    # proven by a probe migration before the job was committed:
    #   - NOT NULL column without a default  → fails only because of the rows
    #   - a downgrade that does not run      → fails the rollback step
    #   - a new tenant table without policy  → fails the policed check
    #   - models that the migrations disagree with → fails the drift check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eligo_owner
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eligo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eligo_owner -d eligo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
      ELIGO_ADMIN_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
      # The explicit-target override (migrations/env.py); fill_every_table
      # refuses to run without it.
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://eligo_owner:ci@localhost:5432/eligo
      ELIGO_DB_APP_ROLE: eligo_app
      ELIGO_DB_APP_ROLE_PASSWORD: ci_app_pw
      ELIGO_DB_SSL: 'false'
      ELIGO_AUTH_ENABLED: 'false'
      ELIGO_LLM_PROVIDER: heuristic

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the base commit has to be checked out beside this one

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install the locked dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Check out the base (what production runs)
        # A PR run checks out the merge commit; its first parent is exactly
        # the main it was merged onto. Not `origin/main`: that is fetched when
        # the run starts, so a re-run after main gained a migration would
        # stamp a revision this tree does not have. A push to main is
        # compared with the commit before it — the previous deploy.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then BASE=$(git rev-parse HEAD^1); else BASE=$BEFORE; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git -C "$RUNNER_TEMP/base" log --oneline -1

      - name: Build the schema as the base builds it
        # Run from the base's directory, so `app` and `migrations` resolve to
        # the BASE code (cwd is first on sys.path; alembic.ini prepends `.`),
        # not to this PR's editable install.
        working-directory: ${{ runner.temp }}/base/backend
        run: |
          python -c "import asyncio; from app.core.database import create_all; asyncio.run(create_all())"
          alembic stamp head
          heads=$(alembic heads | awk '{print $1}')
          if [ "$(echo "$heads" | wc -l)" != 1 ]; then
            echo "::error::the base has more than one migration head: $heads"; exit 1
          fi
          echo "BASE_HEAD=$heads" >> "$GITHUB_ENV"

      - name: Put a row in every table
        # This PR's script, reading the base schema by reflection.
        run: python -m scripts.fill_every_table

      - name: Apply RLS as the base had it
        # Only here, never after the upgrade: Railway runs `alembic upgrade
        # head` and nothing else, so a new table's policy has to come from its
        # own migration. Re-running apply_rls afterwards would hide exactly
        # the 0041 failure.
        working-directory: ${{ runner.temp }}/base/backend
        run: python -m scripts.apply_rls

      - name: Upgrade with this PR's migrations (what the deploy runs)
        id: upgrade
        run: |
          alembic upgrade head
          alembic current

      - name: Roll the new migrations back and forward again
        run: |
          alembic downgrade "$BASE_HEAD"
          alembic upgrade head

      - name: Every tenant table is still policed
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_app:ci_app_pw@localhost:5432/eligo
          ELIGO_AUTH_ENABLED: 'true'
        # The strict check, not the startup guard: the guard treats "could
        # not connect" as a warning, so this step used to pass when the app
        # role could not even log in.
        run: python -m scripts.check_rls_enforced

      - name: Isolation holds on the upgraded database
        env:
          ELIGO_DATABASE_URL: postgresql+asyncpg://eligo_app:ci_app_pw@localhost:5432/eligo
        run: pytest tests/test_rls_postgres.py tests/test_mcp_isolation_postgres.py tests/test_receipt_blackout_postgres.py tests/test_erasure_postgres.py -q

      - name: The upgraded schema matches the models
        # What this catches: a PR whose migrations and model changes disagree.
        # What it cannot: drift that is already on main — the base schema is
        # built by `create_all` from main's models, so an older migration
        # that disagreed with its model is rebuilt from the model here.
        # Last, and run even when an RLS step above failed, so one failure
        # does not hide the other. Skipped when the upgrade itself failed:
        # a half-migrated schema would only print noise.
        if: ${{ !cancelled() && steps.upgrade.outcome == 'success' }}
        run: python -m scripts.schema_drift

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # The search scorer decides what a recruiter sees when they type;
        # a silent regression there looks like missing data.
        run: npm test

      - name: Type-check & build
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7