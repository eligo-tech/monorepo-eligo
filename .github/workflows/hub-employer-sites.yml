# Employers' Impressum — switchboard phone, VAT id, register (ELI-30).
#
# For employers with open ads, those no ad names a contact person first:
# the website from their ads, its Impressum fetched politely (robots.txt,
# identified, paced), and the facts kept only when the Impressum names the
# employer as operator (`backend/app/domain/hub/employer_sites.py`).
#
# Machine-triggered only (ARCHITECTURE.md RULE 1): it calls the deployed API
# with the scoped ingest token; no user and no UI can start a fetch.
# Its own weekly slot (Wednesdays, clear of the Saturday ingest chain) with a
# double budget: the first pass (~240k employers) now drains over months,
# not weeks — the price of keeping the Small instance's Disk IO in budget.
name: Hub · employer Impressum

on:
  schedule:
    - cron: "23 15 * * 3"
  workflow_dispatch:
    inputs:
      budget:
        description: "Employers to check this run (batches of 20)"
        required: false
        default: "10000"

concurrency:
  # Same group as the weekly ingest: one writer on the corpus at a time.
  group: hub-ingest
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Check employers' Impressum
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          BUDGET: ${{ github.event.inputs.budget }}
        run: python -m scripts.hub_daily --employer-sites-only "${BUDGET:-10000}"
