# Employers' own job boards (Personio, Ashby, Greenhouse, Lever) → the shared corpus
# (backend/app/domain/hub/ats.py). A scheduled job only (ARCHITECTURE.md
# RULE 1), over HTTP with the machine token — no database credentials in CI.
#
# Daytime, so it never competes with the weekly ingest chain for the
# database. One parallel job per board system, each with its own time budget,
# so a slow system never costs another its weekly refresh. Each board is one
# feed request (~1/s); Personio adds one job page per new office, Ashby and
# Lever one board page per new DACH board (its name). On the 1st of the month each job
# first rediscovers boards from public URL indexes (Common Crawl, the Wayback
# Machine). A failed run fails the workflow: that is the monitoring.
name: Hub · employer boards (Personio, Ashby, Greenhouse, Lever)

on:
  schedule:
    # Wednesdays: weekly since 2026-11-12 (Disk IO on the Small instance), and
    # mid-week so it never overlaps the Saturday ingest chain, which can run
    # past 24 h. Discovery runs on the first Wednesday of the month.
    - cron: "37 12 * * 3"
  workflow_dispatch:
    inputs:
      ats:
        description: "Which board system"
        required: false
        default: all
        type: choice
        options: [all, personio, ashby, greenhouse, lever-eu, lever]
      discover:
        description: "Find new boards in public URL indexes first"
        required: false
        default: false
        type: boolean
      discover_host:
        description: "Discover on this host only, e.g. job-boards.greenhouse.io (empty = all of the system's hosts)"
        required: false
        default: ""
      minutes:
        description: "Sync time budget in minutes"
        required: false
        default: "120"

concurrency:
  group: hub-ats
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one system failing must not cancel the other's refresh
      matrix:
        ats: ${{ fromJSON(github.event.inputs.ats && github.event.inputs.ats != 'all' && format('["{0}"]', github.event.inputs.ats) || '["personio", "ashby", "greenhouse", "lever-eu", "lever"]') }}
    # Personio: discovery ≤ 40 min Common Crawl + ≤ 26 min Wayback + sync ≤ 120 min.
    # Ashby, Greenhouse, Lever: discovery ≤ 75 min of Wayback pieces (measured
    # 20–36 s each, 36 per host; one piece may overrun by ≤ 17 min) + sync ≤ 120 min.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Sync ${{ matrix.ats }} boards
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          DISCOVER_INPUT: ${{ github.event.inputs.discover }}
          MINUTES_INPUT: ${{ github.event.inputs.minutes }}
          HOST_INPUT: ${{ github.event.inputs.discover_host }}
          ATS_INPUT: ${{ github.event.inputs.ats }}
          ATS: ${{ matrix.ats }}
        run: |
          extra=()
          if [ "$DISCOVER_INPUT" = "true" ] || [ "$(date -u +%-d)" -le 7 ]; then extra=(--discover); fi
          if [ -n "$HOST_INPUT" ]; then
            case "$HOST_INPUT" in *[!a-z0-9.-]*) echo "discover_host must be a host name"; exit 2;; esac
            # A host belongs to one system: with "all", the other systems'
            # jobs would refuse it and lose their refresh. Pick one ats.
            if [ "$ATS_INPUT" = "all" ] || [ -z "$ATS_INPUT" ]; then
              echo "discover_host needs a single ats, not all"; exit 2
            fi
            extra+=(--host "$HOST_INPUT")
          fi
          MINUTES="${MINUTES_INPUT:-120}"
          case "$MINUTES" in ''|*[!0-9]*) echo "minutes must be a number"; exit 2;; esac
          python -m scripts.hub_ats --ats "$ATS" --minutes "$MINUTES" "${extra[@]}"
