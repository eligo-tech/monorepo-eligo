# Nightly corpus refresh.
#
# This workflow is the ONLY thing that fills the shared hub corpus
# (ARCHITECTURE.md RULE 1: ingestion is a scheduled job — no user, no UI).
#
# It calls the deployed API with a scoped machine token, so no database
# credentials live in CI. A failed run fails the workflow, which is the
# monitoring signal (SOC 2 CC7.2) — do not add `continue-on-error`.
#
# Scope is Germany-wide, sharded by Bundesland — and KNOWN to be only ~83%
# complete: `wo=` matches place names, so states sharing a name with a village
# (Hessen, Brandenburg, Sachsen) resolve to the village. The job prints the
# coverage it achieved on every run. PLZ-level sharding is the fix.
#
# `since` is an ENUM, not a day count: only {0, 1, 7, 14, 28} are honoured and
# the source silently returns all ~709,700 postings for anything else.
name: Hub · nightly ingest

on:
  schedule:
    # 03:17 UTC — off the hour so we are not in the thundering herd that every
    # naive cron aims at the top of the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated shards (default: all 16 Bundesländer)"
        required: false
      since:
        description: "Publication window — only 0, 1, 7, 14, 28 are honoured"
        required: false
        default: "1"
        type: choice
        options: ["0", "1", "7", "14", "28"]
      agencies_only:
        # The agency-finder backfill: since=28 + this. Skips the employer
        # sweep, ad text and partner pages — 45k postings of detail calls would
        # outlast the timeout; the hub-descriptions workflow owns that backlog.
        description: "Only the private-recruiter pass (backfill)"
        required: false
        default: false
        type: boolean
      liveness_list:
        # Normally Sundays only (see the liveness job). Set for a first run.
        description: "Also read the full listing and mark suspects tonight"
        required: false
        default: false
        type: boolean
      liveness_checks:
        description: "Suspects to check at the source (0 = none)"
        required: false
        default: "15000"
      eures_full:
        # The first fill of Austria + Switzerland (~89,600 ads, ~1,800 pages,
        # ~75 min), or after an outage. Nightly it reads the last day only.
        description: "EURES: read every AT/CH ad, not just the last day's"
        required: false
        default: false
        type: boolean

concurrency:
  # Never let a slow run overlap the next night's.
  group: hub-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The listing delta is quick, but every newly inserted posting then gets one
    # deliberately paced detail request. At ~11k new roles/day this is roughly
    # 75 minutes, plus ~35 for ~5k new private-recruiter ads (measured
    # 2026-11-02); leave room for upstream variance without overlapping tomorrow.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Refresh corpus
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          ELIGO_HUB_REGIONS: ${{ github.event.inputs.regions || vars.ELIGO_HUB_REGIONS }}
          AGENCIES_ONLY: ${{ github.event.inputs.agencies_only }}
        run: |
          extra=()
          if [ "$AGENCIES_ONLY" = "true" ]; then
            extra=(--agencies-only --no-descriptions --partner-pages 0)
          fi
          python -m scripts.hub_daily \
            --since "${{ github.event.inputs.since || '1' }}" "${extra[@]}"

  # Close ads the source took down (backend/app/domain/hub/liveness.py). After
  # the ingest, never beside it: both lean on the same database.
  #
  # Sundays it first reads the FULL listing (~5,950 pages, ~2 h, measured
  # 2026-11-05) and queues our open ads it did not see as suspects; that night
  # checks fewer. Every night it asks the source about up to `liveness_checks`
  # due suspects — only the source's own "not found" closes one, and only after
  # a known-live control answered. ~8k ads close per day at the source; 15k
  # checks is ~2 h, so the first backlog (~250k closed + ~75k unreachable live
  # ads re-checked every 14-30 days) drains in roughly four weeks.
  # Austria + Switzerland from EURES (backend/app/domain/hub/adapters/eures.py).
  # After the BA ingest, before BA liveness: one writer at a time. Nightly it
  # reads the last day (~19,500 ads, ~400 pages, measured 2026-11-06). Sundays
  # it reads EVERYTHING instead (~1,800 pages) — a late or failed night leaves
  # no gap past a week — and the full listing (~1,800 pages), queueing the open
  # ads it did not see; every night it checks up to 5,000 of them.
  eures:
    needs: ingest
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Ingest Austria + Switzerland
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          FULL_INPUT: ${{ github.event.inputs.eures_full }}
        run: |
          extra=()
          if [ "$FULL_INPUT" = "true" ] || [ "$(date -u +%u)" = "7" ]; then extra=(--full); fi
          python -m scripts.hub_eures "${extra[@]}"

      - name: Close AT/CH ads the source took down
        # One unread ingest shard says nothing about which ads closed.
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          LIST_INPUT: ${{ github.event.inputs.liveness_list }}
        run: |
          extra=()
          if [ "$LIST_INPUT" = "true" ] || [ "$(date -u +%u)" = "7" ]; then extra=(--list); fi
          python -m scripts.hub_liveness --source eures --checks 5000 "${extra[@]}"

  liveness:
    needs: [ingest, eures]
    # A failed ingest says nothing about whether ads closed; a CANCELLED run
    # (someone stopped it) must not start five more hours.
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Close ads the source took down
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          LIST_INPUT: ${{ github.event.inputs.liveness_list }}
          CHECKS_INPUT: ${{ github.event.inputs.liveness_checks }}
        run: |
          extra=()
          CHECKS="${CHECKS_INPUT:-15000}"
          if [ "$LIST_INPUT" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            extra=(--list)
            # The listing takes ~2 h of the budget: check fewer that night.
            if [ -z "$CHECKS_INPUT" ]; then CHECKS=8000; fi
          fi
          python -m scripts.hub_liveness --checks "$CHECKS" "${extra[@]}"
