# Weekly corpus refresh (Saturdays).
#
# This workflow is the ONLY thing that fills the shared hub corpus
# (ARCHITECTURE.md RULE 1: ingestion is a scheduled job — no user, no UI).
#
# It calls the deployed API with a scoped machine token, so no database
# credentials live in CI. A failed run fails the workflow, which is the
# monitoring signal (SOC 2 CC7.2) — do not add `continue-on-error`.
#
# Weekly, not nightly, since 2026-11-12: the nightly chain kept the Supabase
# Small instance's Disk IO budget drained (3-5 h of writes every day). One
# chain, one writer at a time, each job inside GitHub's 6 h cap:
#
#   ingest -> ad text x2 -> ad contacts -> EURES (+ AT/CH liveness)
#          -> BA liveness (full listing) -> BA liveness (more checks)
#
# The cost: new ads reach Markt up to a week late, and ads closed at the
# source (~8k/day) can show as open until the next run.
#
# `since` is an ENUM, not a day count: only {0, 1, 7, 14, 28} are honoured and
# the source silently returns all ~709,700 postings for anything else. 14, not
# 7: one failed or late Saturday then leaves no gap. The overlap re-sees last
# week's ads, which since #250 is a HOT touch of `last_seen_at` only.
name: Hub · weekly ingest

on:
  schedule:
    # Saturday 03:17 UTC — off the hour so we are not in the thundering herd
    # that every naive cron aims at the top of the hour. GitHub has been
    # starting it up to ~8 h late; the chain does not depend on the start time.
    - cron: "17 3 * * 6"
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated shards (default: all 16 Bundesländer)"
        required: false
      since:
        description: "Publication window — only 0, 1, 7, 14, 28 are honoured"
        required: false
        default: "14"
        type: choice
        options: ["0", "1", "7", "14", "28"]
      agencies_only:
        # The agency-finder backfill: since=28 + this. Skips the employer
        # sweep, ad text and partner pages — 45k postings of detail calls would
        # outlast the timeout; the hub-descriptions workflow owns that backlog.
        description: "Only the private-recruiter pass (backfill)"
        required: false
        default: false
        type: boolean
      liveness_checks:
        description: "BA suspects to check in the second liveness job (0 = none)"
        required: false
        default: "30000"

concurrency:
  # One writer on the corpus at a time (hub-employer-sites shares the group).
  group: hub-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The listing only: ad text for the week's ~77k new ads (~11k/day) would
    # take ~9 h of paced detail calls, so the two ad-text jobs below own it,
    # and the contacts pass runs after them, once the texts are in.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Refresh corpus
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          ELIGO_HUB_REGIONS: ${{ github.event.inputs.regions || vars.ELIGO_HUB_REGIONS }}
          AGENCIES_ONLY: ${{ github.event.inputs.agencies_only }}
        run: |
          extra=(--no-descriptions --ad-contacts 0 --ad-contacts-model 0)
          if [ "$AGENCIES_ONLY" = "true" ]; then
            extra=(--agencies-only --no-descriptions --partner-pages 0)
          fi
          python -m scripts.hub_daily \
            --since "${{ github.event.inputs.since || '14' }}" "${extra[@]}"

  # Ad text for every open ad that has none — newest first, saved searches
  # leading (service.fetch_missing_descriptions). Measured 2.4 ads/s
  # (hub-descriptions.yml), so ~45k fits one job; two cover a normal week. A
  # timeout loses nothing: the pass only considers ads with no text yet.
  ad-text-1:
    needs: ingest
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Fetch ad text
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_descriptions --target 45000 --batch 25

  ad-text-2:
    needs: ad-text-1
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Fetch ad text
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_descriptions --target 45000 --batch 25

  # Named contact persons in the week's new and re-fetched ad texts
  # (hub/ad_contacts.py), then the model pass (ELI-25). Nightly this was 100k
  # rules + 20k model reads; a week's new texts are ~77k.
  ad-contacts:
    needs: ad-text-2
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Read ad contacts
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: |
          python -m scripts.hub_daily --ad-contacts-only --ad-contacts 200000 \
            --ad-contacts-model 40000

  # Close ads the source took down (backend/app/domain/hub/liveness.py). After
  # the ingest, never beside it: both lean on the same database.
  #
  # It first reads the FULL listing (~5,950 pages, ~2 h, measured 2026-11-05)
  # and queues our open ads it did not see as suspects, then asks the source
  # about 8,000 due suspects; `liveness-more` asks about `liveness_checks` more.
  # Only the source's own "not found" closes an ad, and only after a known-live
  # control answered. 15k checks is ~2 h. ~8k ads close per day at the source,
  # so ~38k checks a week keeps pace with closures but drains the first
  # backlog (~250k) far slower than the nightly runs did.
  # Austria + Switzerland from EURES (backend/app/domain/hub/adapters/eures.py).
  # After the BA chain, before BA liveness: one writer at a time. Weekly it
  # reads EVERYTHING (~89,600 ads, ~1,800 pages, ~75 min) — a delta has no
  # weekly window — then the full listing (~1,800 pages), queueing the open
  # ads it did not see, and checks up to 5,000 of them.
  eures:
    needs: ad-contacts
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Ingest Austria + Switzerland
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_eures --full

      - name: Close AT/CH ads the source took down
        # One unread ingest shard says nothing about which ads closed.
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_liveness --source eures --checks 5000 --list

  liveness:
    needs: eures
    # A failed ingest says nothing about whether ads closed; a CANCELLED run
    # (someone stopped it) must not start five more hours.
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Read the full listing, close ads the source took down
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_liveness --checks 8000 --list

  liveness-more:
    needs: liveness
    if: ${{ !cancelled() && github.event.inputs.agencies_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Close more ads the source took down
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
          CHECKS: ${{ github.event.inputs.liveness_checks || '30000' }}
        run: python -m scripts.hub_liveness --checks "$CHECKS"

  # Last: store Markt's totals and filter counts (scripts/hub_snapshot.py), so
  # Markt reads one row instead of counting the corpus after every restart.
  snapshot:
    needs: [ingest, liveness-more]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install --no-cache-dir "httpx>=0.27"

      - name: Store Markt's numbers
        working-directory: backend
        env:
          ELIGO_API_BASE: ${{ vars.ELIGO_API_BASE }}
          ELIGO_INGEST_TOKEN: ${{ secrets.ELIGO_INGEST_TOKEN }}
        run: python -m scripts.hub_snapshot
